name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run install:studios
      - run: npm run check
      - run: npm run test:studios
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: nemoodarestan-dist
          path: dist
